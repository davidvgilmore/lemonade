name: Routing Schema Tests
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-schema-tests:
    name: Routing schema + fixtures
    timeout-minutes: 10
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema
      # Pure-python, no server binary needed — fast PR gate for the routing
      # policy/decision schemas. Keeps the back-compat guardrails enforced.
      - name: Validate fixtures against the JSON schemas
        run: python test/test_routing_fixtures.py
      - name: Verify frozen-major schema lock
        run: python test/test_schema_lock.py

  arc-contract-tests:
    name: ARC routing and session contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/lemonade-sdk/lemonade/build-environment:ubuntu24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure and build ARC tests only
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update && apt-get build-dep ./contrib -y
          cmake --preset default -DBUILD_WEB_APP=OFF -DBUILD_TESTING=ON
          cmake --build --preset default --parallel 2 --target test_arc_router test_arc_session
          ctest --test-dir build --output-on-failure --no-tests=error -R '^(ArcRouterTest|ArcSessionTest)$'

  arc-app-tests:
    name: ARC application regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - name: Install and type-check application
        working-directory: src/app
        run: |
          npm ci
          npm run typecheck
      - name: Run application regression tests
        run: node test/app/run-app-regression-tests.cjs

  arc-native-settings-tests:
    name: ARC native settings persistence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Tauri build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      # No custom-protocol feature: this links the library test harness without
      # embedding renderer assets or starting the desktop application.
      - name: Test native settings persistence
        working-directory: src/app/src-tauri
        run: cargo test --locked --lib settings::tests --jobs 2
